name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # src-tauri/bin/ is git-ignored. CI downloads its own FFmpeg sidecar.
      - name: Download Windows FFmpeg sidecar
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64.zip'
          $out = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $exe = Get-ChildItem -Path $out -Recurse -Filter ffmpeg.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $exe) {
            Write-Output '::error::FFmpeg download did not contain bin/ffmpeg.exe.'
            exit 1
          }
          $dest = 'src-tauri/bin/ffmpeg-x86_64-pc-windows-msvc.exe'
          Copy-Item -Path $exe.FullName -Destination $dest -Force
          if (-not (Test-Path $dest)) {
            Write-Output "::error file=$dest::FFmpeg sidecar $dest is missing after the download."
            exit 1
          }

      - name: Download macOS arm64 FFmpeg sidecar
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          dest=src-tauri/bin/ffmpeg-aarch64-apple-darwin
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg-arm64.zip" 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip'
          unzip -o "$RUNNER_TEMP/ffmpeg-arm64.zip" -d "$RUNNER_TEMP/ffmpeg-arm64"
          found=$(find "$RUNNER_TEMP/ffmpeg-arm64" -type f -name ffmpeg | head -n 1)
          if [ -n "$found" ]; then mv "$found" "$dest"; fi
          if [ ! -f "$dest" ]; then
            echo "::error file=$dest::FFmpeg sidecar $dest is missing after the download."
            exit 1
          fi
          chmod +x "$dest"

      - name: Download macOS x86_64 FFmpeg sidecar
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          dest=src-tauri/bin/ffmpeg-x86_64-apple-darwin
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg-amd64.zip" 'https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip'
          unzip -o "$RUNNER_TEMP/ffmpeg-amd64.zip" -d "$RUNNER_TEMP/ffmpeg-amd64"
          found=$(find "$RUNNER_TEMP/ffmpeg-amd64" -type f -name ffmpeg | head -n 1)
          if [ -n "$found" ]; then mv "$found" "$dest"; fi
          if [ ! -f "$dest" ]; then
            echo "::error file=$dest::FFmpeg sidecar $dest is missing after the download."
            exit 1
          fi
          chmod +x "$dest"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Y2K VJ ${{ github.ref_name }}'
          releaseBody: |
            ## Install

            **Windows:** run the `-setup.exe`. If SmartScreen appears, click **More info**, then **Run anyway**.

            **Mac:** open the `.dmg` and drag the app to Applications. If macOS says it is damaged, run this in Terminal:

            ```
            xattr -cr "/Applications/Y2K VJ by Cín.app"
            ```
          releaseDraft: true
          args: --target ${{ matrix.target }}
